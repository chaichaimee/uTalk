summary = "uTalk"
description = """uTalk meningkatkan alur kerja NVDA Anda dengan memberikan konfirmasi suara instan untuk perintah pengeditan penting seperti Salin, Tempel, Potong, Urungkan, Ulangi, Pilih Semua, Simpan, dan Operasi Berkas. Ini dilengkapi penanganan salin cerdas dalam mode telusur, profil bahasa ganda dengan peralihan cepat, aturan per aplikasi, pilihan keluaran ucapan, braille, atau bunyi bip, serta frasa pengumuman yang dapat disesuaikan sepenuhnya.

Tombol Pintas:
NVDA+ALT+T
Ketuk Sekali: Tukar bahasa
Ketuk Dua Kali: Buka pengaturan uTalk
Ketuk Tiga Kali: Matikan atau nyalakan uTalk untuk aplikasi saat ini
Ketuk Empat Kali: Bisukan atau batalkan bisu pengumuman uTalk

Perintah bisu dan aplikasi saat ini juga dapat ditetapkan ke tombolnya sendiri di Gestur Masukan, di bawah kategori uTalk."""