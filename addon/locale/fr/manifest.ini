summary = "uTalk"
description = """uTalk améliore votre flux de travail NVDA en fournissant des confirmations vocales instantanées pour les commandes d'édition essentielles telles que Copier, Coller, Couper, Annuler, Rétablir, Tout sélectionner, Enregistrer et Opérations sur les fichiers. Il propose une gestion intelligente de la copie en mode navigation, des profils bilingues avec commutation rapide et des phrases d'annonce entièrement personnalisables.

Raccourci clavier :
NVDA+ALT+T
Appui simple : Basculer la langue
Double-toucher : ouvrir les paramètres de uTalk"""