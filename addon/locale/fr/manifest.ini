summary = "uTalk"
description = """uTalk améliore votre flux de travail NVDA en fournissant des confirmations vocales instantanées pour les commandes d'édition essentielles telles que Copier, Coller, Couper, Annuler, Rétablir, Tout sélectionner, Enregistrer et Opérations sur les fichiers. Il propose une gestion intelligente de la copie en mode navigation, des profils bilingues avec commutation rapide, des règles par application, un choix de sortie vocale, braille ou par bip, ainsi que des phrases d'annonce entièrement personnalisables.

Touche de raccourci :
NVDA+ALT+T
Un simple appui : Inverser les langues
Double appui : Ouvrir les paramètres de uTalk
Triple appui : Activer ou désactiver uTalk pour l'application active
Quatre appuis : Activer ou désactiver la mise en sourdine des annonces uTalk

Les commandes de mise en sourdine et pour l'application active peuvent également se voir assigner leurs propres touches dans Gestes de commandes, sous la catégorie uTalk."""