summary = "يوتوك"
description = """يحسن يوتوك سير عملك في إن في دي إيه من خلال توفير تأكيدات منطوقة فورية لأوامر التحرير الأساسية مثل النسخ، واللصق، والقص، والتراجع، والإعادة، وتحديد الكل، والحفظ، وعمليات الملفات. يتميز بمعالجة ذكية للنسخ في وضع التصفح، وملفات تعريف ثنائية اللغة مع التبديل السريع، وقواعد لكل تطبيق، وخيار إخراج الصوت، أو برايل، أو الإشارات الصوتية، وعبارات إعلانية قابلة للتخصيص بالكامل.

مفتاح الاختصار:
NVDA+ALT+T
نقرة واحدة: تبديل اللغات
نقران: فتح إعدادات يوتوك
ثلاث نقرات: إيقاف تشغيل يوتوك أو تشغيله للتطبيق الحالي
أربع نقرات: كتم أو إلغاء كتم إعلانات يوتوك

يمكن أيضًا تعيين مفاتيح خاصة بأوامر الكتم والتطبيق الحالي في إيماءات الإدخال، تحت فئة يوتوك."""