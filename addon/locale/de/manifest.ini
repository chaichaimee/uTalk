summary = "uTalk"
description = """uTalk verbessert deinen NVDA-Arbeitsablauf durch sofortige gesprochene Bestätigungen für wichtige Bearbeitungsbefehle wie Kopieren, Einfügen, Ausschneiden, Rückgängig, Wiederholen, Alles auswählen, Speichern und Dateivorgänge. Es bietet eine intelligente Kopierbehandlung im Browsermodus, zweisprachige Profile mit schnellem Umschalten und vollständig anpassbare Ansagetsätze.

Tastenkombination:
NVDA+ALT+T
Einfachtippen: Sprache umschalten
Doppeltippen: uTalk-Einstellungen öffnen"""