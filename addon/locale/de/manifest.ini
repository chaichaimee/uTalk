summary = "uTalk"
description = """uTalk verbessert Ihren NVDA-Arbeitsablauf durch sofortige gesprochene Bestätigungen für wichtige Bearbeitungsbefehle wie Kopieren, Einfügen, Ausschneiden, Rückgängig, Wiederholen, Alles auswählen, Speichern und Dateivorgänge. Es bietet eine intelligente Kopierbehandlung im Browsermodus, zweisprachige Profile mit schnellem Umschalten, anwendungsbezogene Regeln, eine Auswahl an Sprach-, Braille- oder Piepton-Ausgaben und vollständig anpassbare Ansagephrasen.

Tastenkombination:
NVDA+ALT+T
Einfach tippen: Sprachen wechseln
Doppelt tippen: uTalk-Einstellungen öffnen
Dreifach tippen: uTalk für die aktuelle Anwendung ein- oder ausschalten
Viermal tippen: uTalk-Ansagen stummschalten oder Stummschaltung aufheben

Die Befehle für Stummschaltung und aktuelle Anwendung können auch in den Tastenbefehlen unter der Kategorie uTalk eigene Tasten zugewiesen werden."""