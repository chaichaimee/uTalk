summary = "uTalk"
description = """uTalk förbättrar ditt NVDA-arbetsflöde genom att ge omedelbara upplästa bekräftelser för viktiga redigeringskommandon som Kopiera, Klistra in, Klipp ut, Ångra, Gör om, Markera alla, Spara och filåtgärder. Det har smart kopieringshantering i läsläge, profiler för dubbla språk med snabbt byte, per-program-regler, val mellan tal-, punktskrifts- eller bip-utmatning, och fullt anpassningsbara meddelandefraser.

Snabbkommando:
NVDA+ALT+T
Enkeltryck: Byt språk
Dubbeltryck: Öppna uTalk-inställningar
Trippelklick: Slå av eller på uTalk för det aktuella programmet
Fyra tryck: Tysta eller slå på ljudet för uTalk-meddelanden

Kommandona för tyst läge och aktuellt program kan också tilldelas egna tangenter i Inmatningsgester, under uTalk-kategorin."""