description = """uTalk покращує ваш робочий процес NVDA, забезпечуючи миттєві озвучені підтвердження для основних команд редагування, таких як Копіювати, Вставити, Вирізати, Скасувати, Повторити, Вибрати все, Зберегти та Операції з файлами. Він містить інтелектуальну обробку копіювання в режимі огляду, двомовні профілі з швидким перемиканням, правила для окремих програм, вибір виведення голосом, шрифтом Брайля або звуковим сигналом, а також повністю настроювані фрази оголошень.

Гаряча клавіша:
NVDA+ALT+T
Одне торкання: Змінити мови
Подвійне торкання: Відкрити налаштування uTalk
Потрійне торкання: Вимкнути або увімкнути uTalk для поточної програми
Чотири торкання: Вимкнути або увімкнути звук оголошень uTalk

Команди вимкнення звуку та поточної програми також можна призначити на власні клавіші в Жестах введення в категорії uTalk."""