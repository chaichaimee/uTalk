summary = "uTalk"
description = """uTalk 通过为复制、粘贴、剪切、撤销、重做、全选、保存和文件操作等常用编辑命令提供即时的语音提示，来增强您的 NVDA 工作流程。它具有浏览模式下的智能复制处理、支持快速切换的双语言配置文件、针对特定应用程序的规则、语音、盲文或蜂鸣音输出选项以及完全可自定义的提示短语。

热键：
NVDA+ALT+T
单击：切换语言
双击：打开 uTalk 设置
三击：为当前应用程序开启或关闭 uTalk
四击：将 uTalk 提示静音或取消静音

静音和当前应用程序命令也可以在“输入手势”的 uTalk 类别下分配它们自己的按键。"""