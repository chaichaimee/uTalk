summary = "यू टॉक"
description = """यू टॉक कॉपी, पेस्ट, कट, अंडो, रीडो, सिलेक्ट ऑल, सेव और फ़ाइल ऑपरेशन्स जैसे ज़रूरी एडिटिंग कमांड्स के लिए तुरंत बोले जाने वाले कन्फर्मेशन देकर आपके एनवीडीए वर्कफ़्लो को बेहतर बनाता है। इसमें ब्राउज़ मोड में स्मार्ट कॉपी हैंडलिंग, तुरंत स्विच करने की सुविधा के साथ दो भाषा वाले प्रोफाइल्स, प्रति-एप्लीकेशन नियम, स्पीच, ब्रेल या बीप आउटपुट का विकल्प, और पूरी तरह से कस्टमाइज़ किए जाने वाले अनाउंसमेंट फ्रेज़ शामिल हैं।

हॉट की:
एनवीडीए+ऑल्ट+टी
सिंगल टैप: भाषाएं बदलें
डबल टैप: यू टॉक सेटिंग्स खोलें
ट्रिपल टैप: वर्तमान एप्लीकेशन के लिए यू टॉक बंद या चालू करें
चार टैप: यू टॉक अनाउंसमेंट म्यूट या अनम्यूट करें

म्यूट और वर्तमान एप्लीकेशन कमांड्स को इनपुट जेस्चर्स में यू टॉक श्रेणी के अंतर्गत उनकी अपनी कुंजियाँ भी असाइन की जा सकती हैं।"""