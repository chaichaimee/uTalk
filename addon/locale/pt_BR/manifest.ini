summary = "uTalk"
description = """O uTalk aprimora seu fluxo de trabalho no NVDA fornecendo confirmações faladas instantâneas para comandos essenciais de edição, como Copiar, Colar, Recortar, Desfazer, Refazer, Selecionar Tudo, Salvar e Operações de Arquivo. Ele possui tratamento inteligente de cópia no modo de navegação, perfis de dois idiomas com troca rápida, regras por aplicativo, opção de saída por voz, Braille ou bipe, e frases de anúncio totalmente personalizáveis.

Tecla de Atalho:
NVDA+ALT+T
Um toque: Alternar idiomas
Dois toques: Abrir configurações do uTalk
Três toques: Ativar ou desativar o uTalk para o aplicativo atual
Quatro toques: Silenciar ou reativar os anúncios do uTalk

Os comandos de silenciar e de aplicativo atual também podem ter suas próprias teclas atribuídas em Gestos de Entrada, na categoria uTalk."""