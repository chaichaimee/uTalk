summary = "uTalk"
description = """uTalk aprimora seu fluxo de trabalho no NVDA fornecendo confirmações faladas instantâneas para comandos essenciais de edição, como Copiar, Colar, Recortar, Desfazer, Refazer, Selecionar Tudo, Salvar e Operações de Arquivo. Ele apresenta tratamento inteligente de cópia no modo de navegação, perfis de dois idiomas com alternância rápida e frases de anúncio totalmente personalizáveis.

Tecla de atalho:
NVDA+ALT+T
Toque único: alternar idioma
Toque duplo: abrir configurações do uTalk"""