summary = "uTalk"
description = """uTalkは、コピー、貼り付け、切り取り、元に戻す、やり直し、すべて選択、保存、ファイル操作などの基本的な編集コマンドに対して、即座に音声確認を提供することで、NVDAの作業効率を向上させます。ブラウズモードでのスマートなコピー処理、素早い切り替えが可能なデュアル言語プロファイル、アプリケーションごとのルール、音声、点字、ビープ音の選択、完全にカスタマイズ可能なアナウンスフレーズを備えています。

ホットキー:
NVDA+ALT+T
1回タップ: 言語を切り替える
2回タップ: uTalkの設定を開く
3回タップ: 現在のアプリケーションでのuTalkの有効/無効を切り替える
4回タップ: uTalkのアナウンスのミュートを切り替える

ミュートおよび現在のアプリケーションのコマンドは、「入力ジェスチャ」の「uTalk」カテゴリで独自のキーに割り当てることもできます。"""