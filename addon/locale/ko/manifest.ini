summary = "uTalk"
description = """uTalk은 복사, 붙여넣기, 잘라내기, 실행 취소, 다시 실행, 모두 선택, 저장, 파일 작업과 같은 필수 편집 명령에 대해 즉각적인 음성 확인을 제공하여 NVDA 작업 흐름을 향상시킵니다. 탐색 모드에서의 스마트 복사 처리, 빠른 전환이 가능한 이중 언어 프로필, 응용 프로그램별 규칙, 음성, 점자 또는 신호음 출력 선택, 그리고 완전히 사용자 지정 가능한 알림 구문을 제공합니다.

단축키:
NVDA+ALT+T
한 번 탭하기: 언어 전환
두 번 탭하기: uTalk 설정 열기
세 번 탭하기: 현재 응용 프로그램에 대해 uTalk 켜기 또는 끄기
네 번 탭하기: uTalk 알림 음소거 또는 음소거 해제

음소거 및 현재 응용 프로그램 명령은 입력 제어의 uTalk 범주에서 자신만의 키를 지정할 수도 있습니다."""