summary = "uTalk"
description = """uTalk улучшает ваш рабочий процесс NVDA, предоставляя мгновенные голосовые подтверждения для основных команд редактирования, таких как «Копировать», «Вставить», «Вырезать», «Отменить», «Повторить», «Выделить всё», «Сохранить» и операций с файлами. Дополнение включает умную обработку копирования в режиме просмотра, профили двух языков с возможностью быстрого переключения и полностью настраиваемые фразы для озвучивания.

Горячая клавиша:
NVDA+ALT+T
Одинарное касание: переключение языка
Двойное нажатие: открыть настройки uTalk"""