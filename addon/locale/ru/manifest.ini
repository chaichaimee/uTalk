summary = "uTalk"
description = """uTalk улучшает работу с NVDA, обеспечивая мгновенное голосовое подтверждение основных команд редактирования, таких как Копировать, Вставить, Вырезать, Отменить, Повторить, Выделить все, Сохранить и операции с файлами. Дополнение включает интеллектуальную обработку копирования в режиме просмотра, профили двух языков с быстрым переключением, правила для отдельных приложений, выбор вывода с помощью речи, брайля или звуковых сигналов, а также полностью настраиваемые фразы объявлений.

Горячая клавиша:
NVDA+ALT+T
Одиночное касание: переключить языки
Двойное касание: открыть настройки uTalk
Тройное касание: включить или выключить uTalk для текущего приложения
Четыре касания: выключить или включить звук объявлений uTalk

Командам отключения звука и управления текущим приложением также можно назначить собственные клавиши в диалоговом окне «Жесты ввода» в категории uTalk."""