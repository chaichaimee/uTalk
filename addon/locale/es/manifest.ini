summary = "uTalk"
description = """uTalk mejora tu flujo de trabajo en NVDA proporcionando confirmaciones habladas instantáneas para comandos de edición esenciales como Copiar, Pegar, Cortar, Deshacer, Rehacer, Seleccionar todo, Guardar y Operaciones de archivos. Incluye gestión inteligente de copias en el modo exploración, perfiles de doble idioma con cambio rápido, reglas por aplicación, opciones de salida de voz, braille o tonos, y frases de anuncio totalmente personalizables.

Tecla rápida:
NVDA+ALT+T
Un toque: Cambiar idiomas
Doble toque: Abrir configuración de uTalk
Triple toque: Activar o desactivar uTalk para la aplicación actual
Cuatro toques: Silenciar o activar los anuncios de uTalk

Los comandos para silenciar y para la aplicación actual también se pueden asignar a sus propias teclas en Gestos de entrada, dentro de la categoría uTalk."""