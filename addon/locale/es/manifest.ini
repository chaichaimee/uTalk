summary = "uTalk"
description = """uTalk mejora tu flujo de trabajo en NVDA al proporcionar confirmaciones habladas instantáneas para comandos de edición esenciales como Copiar, Pegar, Cortar, Deshacer, Rehacer, Seleccionar todo, Guardar y Operaciones de archivos. Incluye gestión inteligente de copiado en el modo de exploración, perfiles de doble idioma con cambio rápido y frases de anuncios totalmente personalizables.

Atajo de teclado:
NVDA+ALT+T
Un solo toque: alternar idioma
Doble toque: abrir configuración de uTalk"""