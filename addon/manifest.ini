description = """uTalk enhances your NVDA workflow by providing instant spoken confirmations for essential editing commands like Copy, Paste, Cut, Undo, Redo, Select All, Save, and File Operations. It features smart copy handling in browse mode, dual language profiles with quick switching, and fully customizable announcement phrases.

Hot Key:
NVDA+ALT+T
Single Tap : Toggle language
Double Tap : open uTalk setting"""
